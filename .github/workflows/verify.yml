name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fina_test
          POSTGRES_PASSWORD: fina_test
          POSTGRES_DB: fina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fina_test -d fina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://fina_test:fina_test@127.0.0.1:5432/fina_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Activate pnpm 10.0.0
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify
